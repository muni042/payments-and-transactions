syntax = "proto3";

package transactions.v1;

option go_package = "transactions/api/transactions/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

/*
 * Transaction Service
 */
service TransactionService {

  // Create Transaction
  rpc AddTransaction (AddTransactionRequest) returns (AddTransactionResponse) {
    option (google.api.http) = {
      post: "/v1/transactions"
      body: "*"
    };
  }

  // Get Transaction by ID
  rpc GetTransaction (GetTransactionRequest) returns (GetTransactionResponse) {
    option (google.api.http) = {
      get: "/v1/transactions/{transaction_id}"
    };
  }

  // Update Transaction (status / description only)
  rpc UpdateTransaction (UpdateTransactionRequest) returns (UpdateTransactionResponse) {
    option (google.api.http) = {
      patch: "/v1/transactions/{transaction_id}"
      body: "*"
    };
  }
}

/*
 * Add Transaction Request
 */
message AddTransactionRequest {
  string account_id = 1;
  TransactionType transaction_type = 2;
  string amount = 3;              // DECIMAL(20,4) as string
  string currency = 4;
  TransactionStatus status = 5;
  string description = 6;
  string posting_date = 7;        // YYYY-MM-DD
  google.protobuf.Timestamp transaction_date = 8;
}

/*
 * Add Transaction Response
 */
message AddTransactionResponse {
  string transaction_id = 1;
  TransactionStatus status = 2;
  google.protobuf.Timestamp created_at = 3;
}

/*
 * Get Transaction Request
 */
message GetTransactionRequest {
  string transaction_id = 1;
}

/*
 * Get Transaction Response
 */
message GetTransactionResponse {
  string transaction_id = 1;
  string account_id = 2;

  TransactionType transaction_type = 3;
  string amount = 4;
  string currency = 5;

  TransactionStatus status = 6;
  string description = 7;

  string posting_date = 8;
  google.protobuf.Timestamp transaction_date = 9;

  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

/*
 * Update Transaction Request
 */
message UpdateTransactionRequest {
  string transaction_id = 1;
  TransactionStatus status = 2;
  string description = 3;
}

/*
 * Update Transaction Response
 */
message UpdateTransactionResponse {
  string transaction_id = 1;
  TransactionStatus status = 2;
  google.protobuf.Timestamp updated_at = 3;
}

/*
 * Enums
 */
enum TransactionType {
  TRANSACTION_TYPE_UNSPECIFIED = 0;
  TRANSACTION_TYPE_DEBIT = 1;
  TRANSACTION_TYPE_CREDIT = 2;
  TRANSACTION_TYPE_FEE = 3;
  TRANSACTION_TYPE_REVERSAL = 4;
}

enum TransactionStatus {
  TRANSACTION_STATUS_UNSPECIFIED = 0;
  TRANSACTION_STATUS_PENDING = 1;
  TRANSACTION_STATUS_POSTED = 2;
  TRANSACTION_STATUS_ARCHIVED = 3;
  TRANSACTION_STATUS_FAILED = 4;
}

