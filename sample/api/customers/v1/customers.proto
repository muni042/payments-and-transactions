syntax="proto3";

package customers.v1;
option go_package="sample/api/customers/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service CustomersService {

  rpc CreateCustomer(CreateCustomerRequest) returns (CustomerResponse) {
    option (google.api.http) = {
      post: "/v1/customers"
      body: "*"
    };
  }

  rpc GetCustomer(GetCustomerRequest) returns (CustomerResponse) {
    option (google.api.http) = {
      get: "/v1/customers/{customer_id}"
    };
  }

  rpc UpdateCustomer(UpdateCustomerRequest) returns (CustomerResponse) {
    option (google.api.http) = {
      put: "/v1/customers/{customer_id}"
      body: "*"
    };
  }
  rpc CheckCustomerExists(GetCustomerRequest) returns (CheckCustomerExistsResponse) {
  option (google.api.http) = {
    get: "/v1/customers/{customer_id}/exists"
  };
}
  rpc DeleteCustomer(DeleteCustomerRequest) returns (DeleteCustomerResponse) {
    option (google.api.http) = {
      delete: "/v1/customers/{customer_id}"
    };
  }
}

message CreateCustomerRequest {
  string customer_number = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string date_of_birth = 6;
  string status = 7;
  string kyc_status = 8;
}

message GetCustomerRequest {
  int64 customer_id = 1;
}

message UpdateCustomerRequest {
  int64 customer_id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string status = 6;
  string kyc_status = 7;
}

message DeleteCustomerRequest {
  int64 customer_id = 1;
}

message DeleteCustomerResponse {
  string message = 1;
}

message CustomerResponse {
  int64 customer_id = 1;
  string customer_number = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  string phone = 6;
  string date_of_birth = 7;
  string status = 8;
  string kyc_status = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}
message CheckCustomerExistsResponse {
  bool exists = 1;
}
