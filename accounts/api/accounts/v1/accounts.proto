syntax = "proto3";

package accounts.v1;
option go_package = "accounts/api/accounts/v1;v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service AccountsService {

  rpc CreateAccount(CreateAccountRequest) returns (AccountResponse) {
    option (google.api.http) = {
      post: "/v1/accounts"
      body: "*"
    };
  }

  rpc GetAccount(GetAccountRequest) returns (AccountResponse) {
    option (google.api.http) = {
      get: "/v1/accounts/{account_id}"
    };
  }

  rpc UpdateAccount(UpdateAccountRequest) returns (AccountResponse) {
    option (google.api.http) = {
      put: "/v1/accounts/{account_id}"
      body: "*"
    };
  }

  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse) {
    option (google.api.http) = {
      delete: "/v1/accounts/{account_id}"
    };
  }

  rpc ListAccount(ListAccountRequest) returns (ListAccountResponse) {
    option (google.api.http) = {
      get: "/v1/accounts"
    };
  }

  rpc CheckAccountExists(GetAccountRequest) returns (CheckAccountExistsResponse) {
    option (google.api.http) = {
      get: "/v1/accounts/{account_id}/exists"
    };
  }
  rpc CreditAccount(CreditAccountRequest) returns (OperationResponse) {
  option (google.api.http) = {
    post: "/v1/accounts/{account_id}/credit"
    body: "*"
  };
}

rpc DebitAccount(DebitAccountRequest) returns (OperationResponse) {
  option (google.api.http) = {
    post: "/v1/accounts/{account_id}/debit"
    body: "*"
  };
}

}

message CreateAccountRequest {
  int64 customer_id = 1;
  string account_number = 2;
  string account_type = 3;
  string currency = 4;
  string status = 5;
  int64 available_balance = 6;
  int64 pending_balance = 7;
  int64 credit_limit = 8;
  
}

message GetAccountRequest {
  int64 account_id = 1;
}

message UpdateAccountRequest {
  int64 account_id = 1;
  int64 customer_id = 2;
  string account_number = 3;
  string account_type = 4;
  string currency = 5;
  string status = 6;
  int64 available_balance = 7;
  int64 pending_balance = 8;
  int64 credit_limit = 9;
}

message DeleteAccountRequest {
  int64 account_id = 1;
}

message DeleteAccountResponse {
  string message = 1;
}

message ListAccountRequest {
  int64 page = 1;
  int64 limit = 2;
}
message CreditAccountRequest {
  int64 account_id = 1;
  int64 amount = 2;
}

message DebitAccountRequest {
  int64 account_id = 1;
  int64 amount = 2;
}


message ListAccountResponse {
  repeated AccountResponse accounts = 1;
  int64 total = 2;
}

message AccountResponse {
  int64 account_id = 1;
  int64 customer_id = 2;
  string account_number = 3;
  string account_type = 4;
  string currency = 5;
  string status = 6;
  string available_balance = 7;
  string pending_balance = 8;
  string credit_limit = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp last_transaction_at = 12;
}

message CheckAccountExistsResponse {
  bool exists = 1;
}
message OperationResponse {
  bool success = 1;
}

